add_newline = true
# 500 is starship's own default. The kubernetes/gcloud modules below measure <1ms
# (they read local config files), but 200 would silently kill any future module
# that shells out.
command_timeout = 500
format = "[$directory$git_branch$git_state$git_status]($style)$kubernetes$gcloud$cmd_duration$character"
right_format = "$time"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[cmd_duration]
min_time = 2000
format = "[󰔟 $duration]($style) "
style = "yellow"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M:%S"
style = "bright-black"

# Work-only. detect_env_vars gates the whole module: with T_WORK unset it renders
# nothing at all. .zshrc sets T_WORK by directory.
[kubernetes]
disabled = false
detect_env_vars = ["T_WORK"]
format = '[$symbol$context]($style) '
symbol = "☸ "

[[kubernetes.contexts]]
context_pattern = "gke_meas-prod-.*"
context_alias = "PROD"
style = "bold red"

[[kubernetes.contexts]]
context_pattern = "gke_meas-dev-.*"
context_alias = "dev"
style = "dimmed green"

[gcloud]
disabled = false
detect_env_vars = ["T_WORK"]
format = '[$symbol$project]($style) '
symbol = "☁ "
style = "dimmed blue"
